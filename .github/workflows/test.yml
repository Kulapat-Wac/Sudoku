# Runs on every push and pull request, and once a day: lint, unit tests, website checks and E2E browser tests, then builds and tests the Docker image (buildDocker.yml).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:  # manual run
  schedule:
    - cron: "30 23 * * *" #23:30 UTC.
permissions:
  contents: read       # read only

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff==0.17.6

      - name: Run ruff
        run: ruff check .

  puzzles:
    name: Check Sudoku puzzles
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate a puzzle
        working-directory: sudokuMain
        run: python sudoku-generator.py -d hard --seed 1

      - name: Check 10 puzzles per difficulty
        working-directory: sudokuMain
        run: python sudoku-checker.py -n 10

      - name: Run unit tests
        working-directory: sudokuMain
        run: python -m unittest unitTesting -v

  website:
    name: Check website
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm packages
        working-directory: Web
        run: npm ci

      - name: Check npm packages for known vulnerabilities
        working-directory: Web
        run: npm audit --omit=dev

      - name: Start the server
        working-directory: Web
        run: |
          nohup python server.py > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 0.5
          done
          echo "Server did not start:"; cat server.log; exit 1

      - name: Public pages load
        run: |
          for path in / /login /vendor/supabase.js /supabase-config.js "/api/puzzle?difficulty=easy"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done

      - name: Private files are hidden
        run: |
          for path in /server.py /supabase.env /package.json /node_modules/@supabase/supabase-js/package.json /../sudokuMain/sudoku-checker.py; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$path")
            echo "$code $path"
            [ "$code" = "404" ] || exit 1
          done

      - name: Puzzle API returns a valid puzzle
        run: |
          curl -s "http://127.0.0.1:8080/api/puzzle?difficulty=medium" > puzzle.json
          cd sudokuMain && python sudoku-checker.py ../puzzle.json

      - name: Security headers are sent
        run: |
          headers=$(curl -s -D - -o /dev/null http://127.0.0.1:8080/login)
          for h in Content-Security-Policy X-Frame-Options X-Content-Type-Options Referrer-Policy Strict-Transport-Security; do
            echo "$headers" | grep -qi "^$h:" && echo "ok  $h" || { echo "missing $h"; exit 1; }
          done

  e2e:
    name: E2E browser tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm packages (the page loads supabase-js from node_modules)
        working-directory: Web
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: python sudokuMain/e2eTesting.py

  docker:
    name: Docker image
    needs: [puzzles, website, e2e]   # only build once every test has passed
    uses: ./.github/workflows/buildDocker.yml
